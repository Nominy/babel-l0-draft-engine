name: Test and deploy to homeserver

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  deploy:
    name: Deploy to homeserver
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: homeserver
    concurrency:
      group: l0-draft-engine-homeserver-production
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required deployment secret $name is not configured"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

          SERVER_PORT="${SERVER_PORT:-22}"
          if [[ ! "$SERVER_PORT" =~ ^[0-9]+$ ]] || [ "$SERVER_PORT" -lt 1 ] || [ "$SERVER_PORT" -gt 65535 ]; then
            echo "::error::SERVER_PORT must be an integer from 1 to 65535"
            exit 1
          fi
          echo "SERVER_PORT=$SERVER_PORT" >> "$GITHUB_ENV"

          DEPLOY_PATH="${DEPLOY_PATH:-/opt/babel-l0-draft-engine}"
          if [ "$DEPLOY_PATH" = "/" ] || [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "/$DEPLOY_PATH/" == *"/../"* ]]; then
            echo "::error::DEPLOY_PATH must be a safe absolute path"
            exit 1
          fi
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy and verify health
        shell: bash
        run: |
          set -euo pipefail

          deploy_path_b64="$(printf '%s' "$DEPLOY_PATH" | base64 -w0)"
          ssh \
            -F /dev/null \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=20 \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_PATH_B64='$deploy_path_b64' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          DEPLOY_PATH="$(printf '%s' "$DEPLOY_PATH_B64" | base64 --decode)"
          unset DEPLOY_PATH_B64
          env_backup=""
          had_env=0

          finish() {
            status=$?
            trap - EXIT

            if [ "$had_env" -eq 1 ] && [ -n "$env_backup" ] && [ -f "$env_backup" ]; then
              cp -p "$env_backup" "$DEPLOY_PATH/.env"
            fi
            [ -z "$env_backup" ] || rm -f "$env_backup"

            if [ "$status" -ne 0 ]; then
              echo "Deployment failed; collecting compose diagnostics" >&2
              if [ -d "$DEPLOY_PATH" ]; then
                cd "$DEPLOY_PATH"
                docker compose ps >&2 || true
                docker compose logs --no-color --tail=200 >&2 || true
              fi
            fi
            exit "$status"
          }
          trap finish EXIT

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            echo "Existing Git checkout not found at $DEPLOY_PATH" >&2
            exit 1
          fi
          cd "$DEPLOY_PATH"

          if [ -f .env ]; then
            env_backup="$(mktemp)"
            cp -p .env "$env_backup"
            had_env=1
          fi

          git fetch --prune origin main
          git reset --hard origin/main

          if [ "$had_env" -eq 1 ]; then
            cp -p "$env_backup" .env
          fi

          # No git clean or volume removal: local models, .env, and Compose volumes remain intact.
          docker compose up --detach --build --force-recreate --remove-orphans

          health_body=""
          for attempt in $(seq 1 60); do
            health_body="$(curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:8767/health 2>/dev/null || true)"
            if printf '%s' "$health_body" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Waiting for healthy service ($attempt/60)"
            sleep 5
          done

          echo "Health check did not become healthy. Last response: ${health_body:-<empty>}" >&2
          exit 1
          REMOTE
