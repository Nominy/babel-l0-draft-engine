# Replace only the existing <Proxy "balancer://l0-engine"> block.
# Keep its public ProxyPass, <Location> limits, and RequestHeader unchanged.
# Only the coordinator implements public task/capability lookup and drafting.
# Trusted-engine failover is handled by the coordinator, never by this public proxy.
<Proxy "balancer://l0-engine">
    BalancerMember "http://127.0.0.1:18768" retry=1 connectiontimeout=2 timeout=900
    ProxySet lbmethod=byrequests
</Proxy>
